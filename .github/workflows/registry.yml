name: Registry

on:
  pull_request:
    paths: ['registry/**']
  schedule:
    - cron: '0 6 * * 1' # chaque lundi : resynchronise les sources importées (Lethamyr, BakkesPlugins, VGM)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - run: node registry/scripts/validate.mjs

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      # Chaque source est indépendante : si l'une échoue, son fichier reste inchangé et les autres sont mises à jour.
      - name: Import Lethamyr
        continue-on-error: true
        run: node registry/scripts/import-lethamyr.mjs
      - name: Import BakkesPlugins
        # Cloudflare bloque souvent les IP de GitHub Actions (HTTP 403) : dans ce cas,
        # lancer « npm run registry:import:bakkesplugins » en local et committer le résultat.
        continue-on-error: true
        run: node registry/scripts/import-bakkesplugins.mjs || { echo "::warning::Import BakkesPlugins impossible depuis la CI (probablement bloqué par Cloudflare). Lance npm run registry:import:bakkesplugins en local."; exit 1; }
      - name: Import VGM
        continue-on-error: true
        run: node registry/scripts/import-vgm.mjs
      - run: node registry/scripts/validate.mjs
      - name: Commit si le registre a changé
        run: |
          git config user.name "rl-maps-bot"
          git config user.email "rl-maps-bot@users.noreply.github.com"
          # updatedAt change à chaque run : on ne committe que si des maps ont changé
          if git diff --quiet -I '"updatedAt"' -- registry/sources; then
            echo "Aucun changement"
          else
            git add registry/sources
            git commit -m "registry: synchronisation des sources"
            git push
          fi
